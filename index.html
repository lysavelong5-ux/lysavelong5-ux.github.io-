<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Reel Downloader</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-500 to-indigo-600 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 text-center">
        <div class="mb-6">
            <span class="bg-blue-100 text-blue-600 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Fast & Free</span>
            <h1 class="text-2xl font-bold text-gray-800 mt-2">Facebook Reel Downloader</h1>
            <p class="text-gray-500 text-sm mt-1">ទាញយកវីដេអូ Facebook Reels យ៉ាងងាយស្រួល</p>
        </div>

        <div class="space-y-4">
            <input type="text" id="reelUrl" placeholder="បិទភ្ជាប់ Link ទីនេះ..." class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            
            <button onclick="downloadVideo()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition duration-200 shadow-lg shadow-blue-500/30">
                ទាញយកឥឡូវនេះ (Download)
            </button>
        </div>

        <div id="result" class="mt-6 text-sm text-gray-600"></div>
    </div>

    <script>
        async function downloadVideo() {
            const url = document.getElementById('reelUrl').value;
            const resultDiv = document.getElementById('result');
            
            if(!url) {
                alert('សូមបញ្ចូល Link ជាមុនសិន!');
                return;
            }

            resultDiv.innerHTML = `<p class="text-blue-500 animate-pulse">កំពុងទាញយកទិន្នន័យ... សូមរង់ចាំបន្តិច!</p>`;
            
            const apiHost = 'facebook-reel-and-video-downloader.p.rapidapi.com';
            const apiKey = '196bd3e07emshaeef778e1274704p11986cjsn7172a097'; // API Key របស់បង

            try {
                // ប្រើប្រាស់ GET Method ព្រមទាំងដាក់ url តាមរយៈ Query Parameter
                const encodedUrl = encodeURIComponent(url);
                const response = await fetch(`https://${apiHost}/app/main.php?url=${encodedUrl}`, {
                    method: 'GET',
                    headers: {
                        'x-rapidapi-host': apiHost,
                        'x-rapidapi-key': apiKey
                    }
                });

                const data = await response.json();
                
                // ពិនិត្យទម្រង់ទិន្នន័យដែលឆ្លើយតបមកវិញ
                if(data && (data.link || data.video_url || data.download_url)) {
                    const downloadLink = data.link || data.video_url || data.download_url;
                    
                    resultDiv.innerHTML = `
                        <p class="text-green-600 font-medium mb-2">ទាញយកបានសម្រេច!</p>
                        <a href="${downloadLink}" target="_blank" class="inline-block bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-medium transition">
                            ចុចទីនេះដើម្បី Download វីដេអូ
                        </a>`;
                } else {
                    resultDiv.innerHTML = `<p class="text-red-500">រកមិនឃើញវីដេអូ ឬ Link មិនត្រឹមត្រូវ!</p>`;
                }

            } catch (error) {
                console.error(error);
                resultDiv.innerHTML = `<p class="text-red-500">មានបញ្ហាในการតភ្ជាប់ សូមព្យាយាមម្តងទៀត!</p>`;
            }
        }
    </script>

</body>
</html>
