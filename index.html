<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Movie Recap Script Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-600 to-indigo-800 min-h-screen p-4 flex items-center justify-center">

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6 md:p-8">
        <div class="text-center mb-6">
            <span class="bg-purple-100 text-purple-700 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Content Creator Tool</span>
            <h1 class="text-2xl font-bold text-gray-800 mt-2">ប្រព័ន្ធជំនួយសរសេរអត្ថបទសម្រាយរឿង</h1>
            <p class="text-gray-500 text-sm mt-1">បំប្លែងសាច់រឿងសង្ខេប ទៅជា Script សម្រាប់ធ្វើ Video TikTok ឬ YouTube</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ចំណងជើងរឿង (Movie Title)</label>
                <input type="text" id="movieTitle" placeholder="ឧទាហរណ៍៖ Avatar 2..." class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">សាច់រឿងសង្ខេប ឬ តម្រុយសំខាន់ៗ (Plot Points)</label>
                <textarea id="moviePlot" rows="4" placeholder="រៀបរាប់ពីដំណើររឿងផ្តើម ឈុតឆាកជក់ចិត្ត និងភាគបញ្ចប់..." class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm"></textarea>
            </div>
            
            <button onclick="generateRecapScript()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 rounded-xl transition duration-200 shadow-lg shadow-purple-500/30">
                បង្កើត Script សម្រាយរឿងឥឡូវនេះ
            </button>
        </div>

        <div id="resultSection" class="mt-6 hidden">
            <label class="block text-sm font-medium text-gray-700 mb-1">លទ្ធផល Script សម្រាប់យកទៅអាន៖</label>
            <div id="outputScript" class="bg-gray-50 p-4 rounded-xl border border-gray-200 text-sm text-gray-700 whitespace-pre-line max-h-60 overflow-y-auto"></div>
            <button onclick="copyScript()" class="mt-3 bg-gray-800 hover:bg-gray-900 text-white text-xs px-4 py-2 rounded-lg transition">
                ចម្លងអត្ថបទ (Copy Script)
            </button>
        </div>
    </div>

    <script>
        function generateRecapScript() {
            const title = document.getElementById('movieTitle').value;
            const plot = document.getElementById('moviePlot').value;
            const resultSection = document.getElementById('resultSection');
            const outputScript = document.getElementById('outputScript');

            if(!title || !plot) {
                alert('សូមបំពេញចំណងជើងរឿង និងសាច់រឿងសង្ខេបជាមុនសិន!');
                return;
            }

            // បង្កើតទម្រង់ Script សម្រាយរឿងបែបចាប់អារម្មណ៍ (Hook -> Body -> Outro)
            const generatedText = `🎬 សួស្ដីអ្នកទាំងអស់គ្នា! ថ្ងៃនេះយើងនាំយករឿង "${title}" មកសម្រាយជូនទស្សនាហ្មង!
            
🔥 ផ្តើមសាច់រឿង៖
រឿងនេះគឺនិយាយពី ${plot.substring(0, 100)}... 

⚡ ចំណុចរបត់ និងឈុតឆាករំភើប៖
តួអង្គត្រូវប្រឈមមុខនឹងឧបសគ្គយ៉ាងធំធេង ដែលធ្វើឱ្យពួកយើងអត់ទ្រាំមើលមិនបាន។ ${plot}

🏁 សន្និដ្ឋាន និងភាគបញ្ចប់៖
តើដំណើររឿងនឹងបញ្ចប់ទៅយ៉ាងណាដែរ? បើចង់ដឹងច្បាស់ កុំភ្លេចតាមដានទស្សនាទាំងអស់គ្នាណា! 
---
#KhmerRecap #សម្រាយរឿង #${title.replace(/\s+/g, '')}`;

            outputScript.innerText = generatedText;
            resultSection.classList.remove('hidden');
        }

        function copyScript() {
            const text = document.getElementById('outputScript').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('បានចម្លង Script រួចរាល់!');
            });
        }
    </script>

</body>
</html>
